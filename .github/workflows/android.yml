name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unpack project
        run: |
          mkdir -p /tmp/chess-src
          tar -xzf Chess-source.tar.gz -C /tmp/chess-src
      - name: Build debug APK
        working-directory: /tmp/chess-src/Chess_killer-main
        run: |
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chess-overlay-debug-apk
          path: /tmp/chess-src/Chess_killer-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
